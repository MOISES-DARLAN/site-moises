<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário de Cursos</title>
    
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
</head>
<body>
    <div class="container mt-5">
        <div class="row">
            <div class="col-md-6 offset-md-3">
                <div class="card">
                    <div class="card-body">
                        <h5 class="card-title">Cadastro de Cursos</h5>
                        <form>
                            <div class="form-group">
                                <label for="titulo">Título:</label>
                                <input type="text" maxlength="50" class="form-control" id="titulo" placeholder="Digite o título" >
                            </div>
                            <div class="form-group">
                                <label for="imagem">URL da Imagem:</label>
                                <input type="url" class="form-control" id="imagem" placeholder="Cole a URL da imagem">
                            </div>
                            <div class="form-group">
                                <label for="link">URL do Curso:</label>
                                <input type="url" class="form-control" id="link" placeholder="Cole a URL do curso">
                            </div>
                            <button type="submit" class="btn btn-primary">Cadastrar</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Inclua os scripts do Bootstrap (via CDN ou localmente) -->
    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.9.3/dist/umd/popper.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>

    <script src="./js/cadCurso.js"></script>
</body>
</html>
